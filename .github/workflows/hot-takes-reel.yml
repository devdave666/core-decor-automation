name: Hot Takes Reel

# Independent of daily-reel.yml on purpose — different content type (opinion/meme
# format, application photos only, no swatch reveal), different schedule, own
# state files under hot_takes/. Runs at a different time than the 14:00 UTC main
# schedule so the two formats don't both land in the same daily window.
on:
  schedule:
    # 18:00 UTC — a placeholder time, same as the main schedule's own 14:00 UTC
    # choice; adjust once there's engagement data to know what actually performs
    # better. Deliberately not daily to start — every 2 days keeps the "hot take"
    # format feeling occasional rather than diluting it into routine content.
    - cron: "0 18 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hot-takes-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install moviepy requests numpy pillow

      - name: Configure git for automated commits
        run: |
          git config user.name "Core Decor Automation"
          git config user.email "automation@coredecor.local"

      - name: Run Hot Takes pipeline
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
        run: python hot_takes/hot_takes_pipeline.py
