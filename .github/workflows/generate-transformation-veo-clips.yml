name: Generate Transformation Reel (Veo)

# Takes the 5-stage (before/demo/framing/finishing/after) frames from a prior
# generate-transformation-concept.yml run and generates the actual
# transformation reel via Veo 3.1 Lite (veo-3.1-lite-generate-001). Four
# chained 4s first/last-frame generations, audio OFF, concatenated into one
# ~16s video. v2: switched from standard Veo 3.1 with audio (see llms.txt) to
# Lite/no-audio per Dev -- audio is a separate later decision, not something
# to keep paying the standard tier's audio premium for while still iterating
# on the visuals.
#
# REAL MONEY, but far less than v1: Veo 3.1 Lite runs roughly $0.05/s with no
# audio, so four 4s clips is on the order of $0.80/run (v1's standard-tier,
# audio-on equivalent was ~$12/run for the same total duration). Still
# workflow_dispatch only, same discipline as every other paid-generation
# workflow here -- never on a timer.
#
# Takes the source frames as a run ID to download from rather than requiring
# them to be committed -- this format is still experimental (see
# transformation_reel/), nothing is promoted into the repo's real assets yet.

on:
  workflow_dispatch:
    inputs:
      concept:
        description: "Concept key, must match the frames artifact name suffix"
        required: true
        default: "t01"
      frames_run_id:
        description: "Run ID of the generate-transformation-concept.yml run whose artifact has the frames"
        required: true

permissions:
  contents: read
  id-token: write
  actions: read  # needed to download another run's artifact

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download concept frames from the prior run
        uses: actions/download-artifact@v4
        with:
          name: transformation-concept-${{ inputs.concept }}
          path: concept_output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.frames_run_id }}

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-58f4f689-36b9-406b-bfa"
          workload_identity_provider: "projects/584573644858/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "vertex-ai-runner@project-58f4f689-36b9-406b-bfa.iam.gserviceaccount.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-genai
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate the four Veo clips and concatenate
        run: python3 transformation_reel/generate_veo_clips.py "${{ inputs.concept }}" concept_output veo_output

      # if: always() -- the Veo generations are the expensive, slow part. A
      # failure in the cheap local ffmpeg concat step (as happened on v1's
      # first real run -- ffmpeg wasn't on the runner) must not throw that
      # spend away silently; upload whatever clips exist even if concatenation
      # itself failed.
      - name: Upload the final reel and intermediate clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformation-reel-${{ inputs.concept }}
          path: veo_output/*.mp4
          if-no-files-found: warn
