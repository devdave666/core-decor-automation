name: Introspect ImageConfig

on:
  workflow_dispatch: {}

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install SDK and inspect ImageConfig fields
        run: |
          pip install google-genai
          python3 -c "
          from google.genai import types
          import inspect
          print('=== ImageConfig fields ===')
          if hasattr(types.ImageConfig, 'model_fields'):
              for name, field in types.ImageConfig.model_fields.items():
                  print(f'{name}: {field}')
          else:
              print(inspect.signature(types.ImageConfig.__init__))
          print()
          print('=== GenerateContentConfig image-related fields ===')
          if hasattr(types.GenerateContentConfig, 'model_fields'):
              for name, field in types.GenerateContentConfig.model_fields.items():
                  if 'image' in name.lower():
                      print(f'{name}: {field}')
          "
