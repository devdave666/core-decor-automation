name: Check Facebook Video Insights

# Diagnostic tool, not a scheduled pipeline step: pulls real Graph API video_insights
# for one or more Facebook video_ids (comma-separated), so reach/distribution can be
# judged from actual numbers instead of guessing. Requests a broad metric list and
# lets the API itself report which ones are valid/deprecated for this app version --
# Meta deprecates Page/video Insights metrics without much warning (a batch went out
# June 15 2026), so asking the API directly beats trusting any doc summary.

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "Comma-separated Facebook video_ids to check (not post_ids)"
        required: true
        type: string
      post_ids:
        description: "Comma-separated Facebook post_ids, same order as video_ids, for cross-checking the post-level /insights edge and basic reaction/share counts"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-insights:
    runs-on: ubuntu-latest
    steps:
      - name: Query video_insights for each video_id
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids }}
          POST_IDS: ${{ github.event.inputs.post_ids }}
        run: |
          python3 -c "
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['META_SYSTEM_USER_TOKEN']
          video_ids = [v.strip() for v in os.environ['VIDEO_IDS'].split(',') if v.strip()]
          post_ids = [v.strip() for v in os.environ.get('POST_IDS', '').split(',') if v.strip()]

          def call(path, params):
              params = dict(params, access_token=token)
              url = f'https://graph.facebook.com/v23.0/{path}?' + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return json.loads(e.read())

          for vid in video_ids:
              print(f'=== video_id {vid} ===')
              print('-- basic fields (sanity check the ID itself resolves) --')
              print(json.dumps(call(vid, {'fields': 'id,length,status,updated_time'}), indent=2))
              for metric in ['total_video_views', 'total_video_impressions', 'total_video_avg_time_watched']:
                  print(f'-- video_insights: {metric} (single-metric) --')
                  print(json.dumps(call(f'{vid}/video_insights', {'metric': metric}), indent=2))
              print()

          for pid in post_ids:
              print(f'=== post_id {pid} ===')
              print('-- basic engagement fields --')
              print(json.dumps(call(pid, {'fields': 'id,created_time,shares,reactions.summary(true),comments.summary(true)'}), indent=2))
              for metric in ['post_video_views', 'post_impressions', 'post_impressions_organic', 'post_engaged_users']:
                  print(f'-- post insights: {metric} (single-metric) --')
                  print(json.dumps(call(f'{pid}/insights', {'metric': metric}), indent=2))
              print()
          "
