name: Test Vertex AI Image Generation Connection

# One-off connectivity test for the new e-series image generation path (Google's
# image generation via Vertex AI, authenticated with Workload Identity Federation
# -- no static key ever stored). Confirms the WIF setup + model access actually
# works end-to-end before anything real depends on it. Not wired into any
# content pipeline yet.
#
# Two guessed model names (imagen-4.0-generate-001, gemini-2.5-flash-image-preview)
# both 404'd in real runs -- see llms.txt. Rather than guess a third time, this
# queries Vertex's own publisher-model catalog for this exact project/region,
# filters for anything image-related, and tries each candidate until one
# actually produces an image. Ground truth instead of another guess.
#
# Requires the Workload Identity Pool/Provider and the vertex-ai-runner service
# account (with roles/aiplatform.user granted) to already exist in the GCP
# project -- see llms.txt for the exact gcloud commands. This workflow only
# handles the GitHub Actions side.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # required for WIF's OIDC token exchange

jobs:
  test-imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-58f4f689-36b9-406b-bfa"
          workload_identity_provider: "projects/584573644858/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "vertex-ai-runner@project-58f4f689-36b9-406b-bfa.iam.gserviceaccount.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: List available publisher image models, then try each until one works
        run: python3 discover_and_test_image_model.py

      - name: Upload the test image as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagen-test-output
          path: test_output_*.png
          if-no-files-found: warn
