name: Publish Existing Video to Instagram

# One-off recovery/cross-post tool, sibling to publish-existing-to-facebook.yml:
# publishes an ALREADY-HOSTED video (a video_url that already exists, e.g. one
# committed via core_decor_reel_pipeline.upload_video_to_public_host() by a
# format that has no automated end-to-end publish pipeline of its own yet,
# such as transformation_reel) straight to Instagram via the same proven
# publish_to_instagram() used everywhere else. Does NOT touch any rotation
# counters and does NOT generate new content. Not on a schedule; workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public URL of the already-hosted video (e.g. a raw.githubusercontent.com media/... URL)"
        required: true
        type: string
      caption:
        description: "Exact caption to use for this post"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Publish to Instagram
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          CAPTION: ${{ github.event.inputs.caption }}
        run: |
          python -c "
          import os
          import core_decor_reel_pipeline as core

          ig_id = core.publish_to_instagram(os.environ['VIDEO_URL'], os.environ['CAPTION'])
          print(f'Published to Instagram: media_id={ig_id}')
          "
