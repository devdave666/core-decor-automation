name: Upload E-Series Images to Drive

# Uploads generated e-series images (already committed to
# assets/application_eseries/) to Drive for easy viewing, using the same
# OAuth integration already powering template-reel fetching and the
# reference-reel folders. Nests output under a per-set subfolder of
# "E-Series Generated Output" (sibling to "E-Series Reference Reels") so
# future sets don't mix together in one flat folder.

on:
  workflow_dispatch:
    inputs:
      set_id:
        description: "E-series set id whose images to upload (e.g. e1-01)"
        required: true
        default: "e1-01"
      subdir:
        description: "Optional subfolder under assets/application_eseries/ to upload from instead (e.g. upscaled_test)"
        required: false
        type: string
      drive_folder_name:
        description: "Optional Drive subfolder name override (default: set_id). Used for the e2-* grand-house sets, where Dev wants the Drive folder named by architecture type (e.g. 'Gothic') rather than the internal set id."
        required: false
        type: string
      parent_folder_name:
        description: "Optional Drive parent folder name override (default: 'E-Series Generated Output')"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Upload images to Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SET_ID: ${{ github.event.inputs.set_id }}
          SUBDIR: ${{ github.event.inputs.subdir }}
          DRIVE_FOLDER_NAME: ${{ github.event.inputs.drive_folder_name }}
          PARENT_FOLDER_NAME: ${{ github.event.inputs.parent_folder_name }}
        run: |
          python3 -c "
          import os
          from pathlib import Path
          from drive_upload import get_or_create_folder, upload_file, ROOT_FOLDER_ID

          set_id = os.environ['SET_ID']
          subdir = os.environ.get('SUBDIR', '').strip()
          drive_folder_name = os.environ.get('DRIVE_FOLDER_NAME', '').strip() or set_id
          parent_folder_name = os.environ.get('PARENT_FOLDER_NAME', '').strip() or 'E-Series Generated Output'
          output_root = get_or_create_folder(parent_folder_name, ROOT_FOLDER_ID)
          set_folder = get_or_create_folder(drive_folder_name, output_root)
          if subdir:
              set_folder = get_or_create_folder(subdir, set_folder)
          print(f'Set folder: https://drive.google.com/drive/folders/{set_folder}')
          print()

          src_dir = Path('assets/application_eseries') / subdir
          matches = sorted(src_dir.glob(f'{set_id}_*.png'))
          if not matches:
              print(f'No files matching {set_id}_*.png found in {src_dir}')
              raise SystemExit(1)

          for p in matches:
              result = upload_file(str(p), set_folder)
              print(f\"{p.name} -> {result.get('webViewLink')}\")
          "
