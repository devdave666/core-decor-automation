name: Publish Existing Video to YouTube

# One-off recovery/cross-post tool, sibling to publish-existing-to-facebook.yml:
# publishes an ALREADY-HOSTED video to YouTube (Shorts) via Buffer, using the
# same proven publish_to_buffer() used everywhere else. Does NOT touch any
# rotation counters and does NOT generate new content. Not on a schedule;
# workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public URL of the already-hosted video (e.g. a raw.githubusercontent.com media/... URL)"
        required: true
        type: string
      caption:
        description: "Exact caption to use for this post"
        required: true
        type: string
      youtube_title:
        description: "Video title (YouTube requires this separately from the caption/description)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-to-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Publish to YouTube via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          CAPTION: ${{ github.event.inputs.caption }}
          YOUTUBE_TITLE: ${{ github.event.inputs.youtube_title }}
        run: |
          python -c "
          import os
          import core_decor_reel_pipeline as core

          post_id = core.publish_to_buffer(
              os.environ['VIDEO_URL'],
              os.environ['CAPTION'],
              os.environ['BUFFER_YOUTUBE_CHANNEL_ID'],
              'youtube',
              youtube_title=os.environ['YOUTUBE_TITLE'],
          )
          print(f'Published to YouTube: post_id={post_id}')
          "
